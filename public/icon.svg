<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">DOR101 — Dorchester 101</title>
  <desc id="description">A harbor-blue DOR101 wordmark with outlined, halftone letters and an offset skyline-inspired shadow.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#B8DCDD"/>
      <stop offset="0.62" stop-color="#D8E4DF"/>
      <stop offset="1" stop-color="#A9C2C2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A7387"/>
      <stop offset="0.52" stop-color="#123D54"/>
      <stop offset="1" stop-color="#287087"/>
    </linearGradient>
    <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.15" fill="#173543" fill-opacity="0.58"/>
      <circle cx="4.5" cy="4.5" r="0.8" fill="#173543" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#123D54"/>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="386" cy="132" r="75" fill="#F2C986" fill-opacity="0.2"/>
    <circle cx="386" cy="132" r="49" fill="#F2C986" fill-opacity="0.2"/>

    <!-- A compact Boston skyline silhouette sits beneath the wordmark. -->
    <g fill="#193B49">
      <path d="M0 345h41v-42h28v42h29v-69h20v69h31V253h35v92h23v-52h28v52h22v-84h40v84h25v-57h22v57h26v-70h35v70h22v-44h31v44h37v78H0z"/>
      <path d="M225 293v-93l9-8 9 8v93zM230 194v-20h8v20zM355 291v-65h26v65zM382 290v-49h20v49z" fill="#102D3A"/>
      <path d="M349 220h38v7h-38z" fill="#8FB7B7" fill-opacity="0.64"/>
    </g>
    <g fill="#E7F0E9" fill-opacity="0.66">
      <path d="M105 292h5v11h-5zM119 292h5v11h-5zM105 313h5v11h-5zM119 313h5v11h-5z"/>
      <path d="M159 270h6v10h-6zM172 270h6v10h-6zM159 289h6v10h-6zM172 289h6v10h-6zM159 308h6v10h-6zM172 308h6v10h-6z"/>
      <path d="M275 279h6v10h-6zM291 279h6v10h-6zM275 298h6v10h-6zM291 298h6v10h-6z"/>
      <path d="M424 292h5v10h-5zM438 292h5v10h-5zM424 311h5v10h-5zM438 311h5v10h-5z"/>
    </g>

    <!-- Layered outline strokes recreate the stacked lettering in the reference. -->
    <g font-family="Arial Black, Public Sans, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-3" stroke-linejoin="round">
      <text x="36" y="249" textLength="440" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#173541" stroke-opacity="0.3" stroke-width="2.5" transform="translate(12 11)">DOR101</text>
      <text x="36" y="249" textLength="440" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#173541" stroke-opacity="0.46" stroke-width="2.2" transform="translate(8 8)">DOR101</text>
      <text x="36" y="249" textLength="440" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#173541" stroke-opacity="0.72" stroke-width="2" transform="translate(4 4)">DOR101</text>
      <text x="36" y="249" textLength="440" lengthAdjust="spacingAndGlyphs" fill="url(#halftone)" stroke="#142F3B" stroke-width="2.2" paint-order="stroke fill">DOR101</text>
      <text x="36" y="249" textLength="440" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#F4FBF8" stroke-opacity="0.62" stroke-width="0.9">DOR101</text>
    </g>

    <!-- Harbor water and a fine sail line anchor the badge. -->
    <path d="M0 386c45-8 80 8 126 0s82-8 126 0 84 8 130 0 85-8 130 0v126H0z" fill="url(#water)"/>
    <path d="M0 417c52-9 90 9 144 0s96-9 148 0 98 9 148 0 49-4 72 0" fill="none" stroke="#C3E5E3" stroke-opacity="0.58" stroke-width="5"/>
    <path d="M0 450c52-8 92 8 145 0s95-8 148 0 100 8 151 0 50-4 68 0" fill="none" stroke="#9CCDD0" stroke-opacity="0.4" stroke-width="4"/>
    <path d="M53 401h75" stroke="#F3EEE2" stroke-opacity="0.88" stroke-width="2"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#F7FCFA" stroke-opacity="0.32" stroke-width="3"/>
</svg>
