<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOR101 — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #F6F7F4;
      color: #23332A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 440px;
    }
    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.5rem;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(21, 36, 29, 0.18);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #15241D;
      margin-bottom: 0.75rem;
    }
    p {
      color: #5D6C63;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .emergency {
      background: #D7261E;
      color: white;
      padding: 1.25rem;
      border-radius: 16px;
      margin-bottom: 1rem;
    }
    .emergency.second {
      background: #0F2820;
    }
    .emergency h3 { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.85; margin-bottom: 0.4rem; }
    .emergency a {
      color: white;
      font-size: 1.4rem;
      font-weight: 800;
      text-decoration: none;
    }
    .emergency small { display: block; opacity: 0.75; font-size: 0.75rem; margin-top: 0.25rem; }
    button {
      background: #15241D;
      color: #F6F7F4;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover { background: #23332A; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/icon.svg" alt="DOR101" class="icon">
    <h1>You&rsquo;re offline</h1>
    <p>
      The Dot desk needs a connection to load the latest housing, food, and
      transit numbers. Check your signal and try again.
    </p>

    <div class="emergency">
      <h3>Need help right now?</h3>
      <a href="tel:211">Call 2-1-1</a>
      <small>Free · 24/7 · any language</small>
    </div>

    <div class="emergency second">
      <h3>Need food today?</h3>
      <a href="tel:18006458333">1-800-645-8333</a>
      <small>Project Bread FoodSource Hotline · Mon&ndash;Fri 8am&ndash;5pm</small>
    </div>

    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
