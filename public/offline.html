<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOR101 — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #222d40;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 460px; }
    .brand { display: flex; align-items: center; gap: 0.75rem; justify-content: center; margin-bottom: 2rem; }
    .brand img { width: 44px; height: 44px; }
    .brand span {
      font: 700 1.5rem/1 'Barlow Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
      letter-spacing: 0.02em; color: #111a2c;
    }
    .brand span em { color: #1748e2; font-style: normal; }
    h1 {
      font: 700 2rem/1.05 'Barlow Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
      text-transform: uppercase; letter-spacing: 0.01em; color: #111a2c;
      text-align: center; margin-bottom: 0.75rem;
    }
    p {
      color: #55617a; font-size: 0.95rem; line-height: 1.65;
      margin-bottom: 1.5rem; text-align: center;
    }
    .emergency {
      border-left: 5px solid #1748e2;
      background: #e9edf1; padding: 1.1rem 1.25rem; margin-bottom: 0.85rem;
      text-align: left;
    }
    .emergency.second { border-left-color: #d22630; }
    .emergency h3 {
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.16em; color: #55617a; margin-bottom: 0.3rem;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .emergency a {
      color: #111a2c; font: 700 1.35rem/1.2 'Barlow Condensed', 'Arial Narrow', sans-serif;
      letter-spacing: 0.02em; text-decoration: underline; text-underline-offset: 3px;
      text-decoration-color: #cdd5de;
    }
    .emergency small { display: block; color: #5d6a7e; font-size: 0.78rem; margin-top: 0.3rem; }
    button {
      display: block; margin: 1.4rem auto 0;
      background: #1748e2; color: #fff; border: 1px solid #1748e2;
      padding: 0.7rem 2rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0f3ac0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <img src="/icon.svg" alt="">
      <span>DOR<em>101</em></span>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>
      DOR101 needs a connection to load the latest housing, food, and
      transit numbers. Check your signal and try again.
    </p>

    <div class="emergency">
      <h3>Need help right now?</h3>
      <a href="tel:211">Call 2-1-1</a>
      <small>Free · 24/7 · any language</small>
    </div>

    <div class="emergency second">
      <h3>Need food today?</h3>
      <a href="tel:18006458333">1-800-645-8333</a>
      <small>Project Bread FoodSource Hotline · Mon&ndash;Fri 8am&ndash;5pm</small>
    </div>

    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
